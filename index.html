<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>チャッピー＆サリーのしあわせスイッチ</title>

<style>
body{
  margin:0;
  padding:18px 14px 40px;
  background:#fff1f8;
  font-family:"Hiragino Kaku Gothic ProN",sans-serif;
  text-align:center;
  color:#6b4b2a;
}

.wrap{
  max-width:620px;
  margin:0 auto;
}

.main-card{
  background:linear-gradient(180deg,#fff8fc,#fff0f7);
  border-radius:28px;
  padding:20px 14px 28px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
}

.cover{
  width:100%;
  max-width:560px;
  border-radius:24px;
  display:block;
  margin:0 auto 22px;
  box-shadow:0 8px 18px rgba(0,0,0,0.12);
}

h1{
  color:#6b4b2a;
  font-size:24px;
  line-height:1.5;
  margin:0 0 10px;
}

.desc{
  font-size:15px;
  line-height:1.8;
  color:#7b5b39;
  margin:0 auto 20px;
}

.menu{
  display:grid;
  gap:14px;
  margin-top:18px;
}

.menu a{
  display:block;
  width:90%;
  margin:0 auto;
  text-decoration:none;
  border-radius:30px;
  padding:15px 12px;
  font-size:17px;
  font-weight:bold;
  color:#fff;
  box-shadow:0 5px 14px rgba(0,0,0,0.10);
}

.note{
  display:block;
  margin-top:6px;
  font-size:13px;
  font-weight:normal;
  line-height:1.5;
  opacity:0.95;
}

.reborn{
  background:linear-gradient(135deg,#8fd3a8,#59b985);
}

.tarot{
  background:linear-gradient(135deg,#c9a4ff,#8f82ff);
}

.bank{
  background:linear-gradient(135deg,#ffd86f,#e8aa38);
  color:#6b4b2a !important;
}

.omikuji{
  background:linear-gradient(135deg,#f7a1c4,#ed7fb2);
}

.footer{
  margin-top:22px;
  font-size:13px;
  line-height:1.7;
  color:#8a6a4a;
}

@media(max-width:480px){
  h1{
    font-size:22px;
  }

  .menu a{
    font-size:16px;
    padding:14px 10px;
  }
}
</style>
</head>

<body>

<div class="wrap">
  <div class="main-card">

    <img src="images/cs_menu_cover.png" alt="チャッピー＆サリーのしあわせスイッチ" class="cover">

    <h1>🌈 今日の気分で選んでね 🌈</h1>

    <p class="desc">
      チャッピー＆サリーの<br>
      無料しあわせアプリ入口です🐾
    </p>

    <div class="menu">

      <a class="reborn" href="https://chappy-sally.github.io/chappy-sally-reborn/">
        🌿 私に戻るメッセージ
        <span class="note">今の自分をやさしく整える</span>
      </a>

      <a class="tarot" href="https://chappy-sally.github.io/Daily-Card/">
        🔮 無料タロット
        <span class="note">今日の1枚メッセージ</span>
      </a>

      <a class="bank" href="https://chappy-sally.github.io/space-bank-atm/">
        💰 宇宙銀行ATM
        <span class="note">脳もバグっちゃうしあわせエネルギーチャージ</span>
      </a>

      <a class="omikuji" href="https://chappy-sally.github.io/omikuji-app/">
        🍀 おみくじ
        <span class="note">今日のラッキーメッセージ</span>
      </a>

    </div>

    <div class="footer">
      迷ったら、気になるものをタップしてね😊<br>
      必要なメッセージが届きますように🌈
    </div>

  </div>
</div>

</body>
</html>
